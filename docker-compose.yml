name: xpawsure

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xpawsure}
      POSTGRES_USER: ${POSTGRES_USER:-xpawsure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xpawsure} -d ${POSTGRES_DB:-xpawsure}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
